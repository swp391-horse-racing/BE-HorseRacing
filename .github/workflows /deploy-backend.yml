name: Deploy Backend to Oracle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -p ${{ secrets.ORACLE_PORT }} -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts

      - name: Upload jar to Oracle
        run: |
          scp -P ${{ secrets.ORACLE_PORT }} -i ~/.ssh/oracle_key target/*.jar \
          ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/tmp/horse_backend.jar

      - name: Restart backend
        run: |
          ssh -p ${{ secrets.ORACLE_PORT }} -i ~/.ssh/oracle_key \
          ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
          "sudo mv /tmp/horse_backend.jar /opt/horse-racing/backend/horse_backend.jar && sudo systemctl daemon-reload && sudo systemctl restart horse-backend && sudo systemctl status horse-backend --no-pager"
