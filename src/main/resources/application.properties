spring.application.name=hoser_backend

server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
app.admin.seed.username=${ADMIN_SEED_USERNAME:admin}
app.admin.seed.email=${ADMIN_SEED_EMAIL:admin@example.local}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:Admin12345!}

app.payment.callback-token=${PAYMENT_CALLBACK_TOKEN}

logging.level.com.minhthien.web.hoser=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

vnpt.ekyc.base-url=${VNPT_EKYC_BASE_URL:https://api.idg.vnpt.vn}
vnpt.ekyc.token-id=${VNPT_EKYC_TOKEN_ID:}
vnpt.ekyc.token-key=${VNPT_EKYC_TOKEN_KEY:}
vnpt.ekyc.access-token=${VNPT_EKYC_ACCESS_TOKEN:}
vnpt.ekyc.mac-address=${VNPT_EKYC_MAC_ADDRESS:TEST1}
vnpt.ekyc.document-type=${VNPT_EKYC_DOCUMENT_TYPE:-1}
vnpt.ekyc.crop-param=${VNPT_EKYC_CROP_PARAM:0.14,0.3}
vnpt.ekyc.validate-postcode=${VNPT_EKYC_VALIDATE_POSTCODE:true}
vnpt.ekyc.face-match-threshold=${VNPT_EKYC_FACE_MATCH_THRESHOLD:80}

kyc.http.connect-timeout-ms=10000
kyc.http.read-timeout-ms=30000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

google.client-id=${GOOGLE_CLIENT_ID}

facebook.app-id=${FACEBOOK_APP_ID}
facebook.app-secret=${FACEBOOK_APP_SECRET}

zalopay.app-id=${ZALOPAY_APP_ID}
zalopay.key1=${ZALOPAY_KEY1}
zalopay.key2=${ZALOPAY_KEY2}
zalopay.create-url=https://sb-openapi.zalopay.vn/v2/create
zalopay.query-url=https://sb-openapi.zalopay.vn/v2/query

app.public-url=${APP_PUBLIC_URL}
zalopay.redirect-url=${ZALOPAY_REDIRECT_URL}